<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DeskGroups</title>
<style>
  :root { --glass: rgba(18,22,28,.58); --line: rgba(255,255,255,.2); --ink: #f1f3f5; --dim: #b8bec6; --accent: #4fb3a5; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font: 13px "Segoe UI", system-ui, sans-serif; color: var(--ink); user-select: none; }
  #desk { height: 100%; padding: 18px; display: flex; flex-direction: column; flex-wrap: wrap;
    align-content: flex-start; gap: 14px 10px; }
  .tile { width: 92px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: default; }
  .tile .label { max-width: 90px; text-align: center; line-height: 1.25; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    text-shadow: 0 1px 3px rgba(0,0,0,.85); }
  .tile:hover .box, .tile:hover > .ico { outline: 2px solid rgba(255,255,255,.35); }
  .box { width: 64px; height: 64px; border-radius: 16px; background: var(--glass); border: 1px solid var(--line);
    backdrop-filter: blur(14px); display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 7px; }
  .ico { width: 44px; height: 44px; border-radius: 10px; background: #36404c center / contain no-repeat;
    display: grid; place-items: center; font-weight: 600; font-size: 18px; color: var(--ink); }
  .box .ico { width: 100%; height: 100%; font-size: 11px; border-radius: 6px; }
  .tile > .ico { width: 56px; height: 56px; border-radius: 12px; }
  #dock { position: fixed; right: 18px; bottom: 18px; display: flex; gap: 8px; opacity: .55; transition: opacity .15s; }
  #dock:hover { opacity: 1; }
  button, input { font: inherit; color: var(--ink); }
  button { background: var(--glass); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px;
    cursor: pointer; backdrop-filter: blur(14px); }
  button:hover { border-color: var(--accent); }
  button.danger:hover { border-color: #d9665f; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input { background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 100%; }
  #layer { position: fixed; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.35);
    backdrop-filter: blur(6px); }
  #layer.on { display: grid; }
  .sheet { width: min(640px, 90vw); max-height: 80vh; overflow: auto; background: rgba(22,27,34,.92);
    border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
  .sheet.drop { border-color: var(--accent); }
  .head { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
  .head input { font-size: 16px; font-weight: 600; background: transparent; border-color: transparent; }
  .head input:hover, .head input:focus { border-color: var(--line); }
  .grid { display: flex; flex-wrap: wrap; gap: 14px 8px; min-height: 90px; }
  .item { position: relative; width: 92px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .item .label { text-align: center; max-width: 90px; overflow: hidden; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .item .ico { width: 52px; height: 52px; }
  .item:hover .ico { outline: 2px solid rgba(255,255,255,.35); }
  .x { position: absolute; top: -4px; right: 8px; width: 20px; height: 20px; padding: 0; border-radius: 6px;
    display: none; line-height: 1; }
  .item:hover .x { display: block; }
  .hint { color: var(--dim); margin: 12px 0 0; }
  form.ask { display: grid; gap: 10px; }
  form.ask h3 { margin: 0 0 4px; font-size: 15px; }
  .row { display: flex; gap: 8px; justify-content: flex-end; }
</style>
</head>
<body>
<div id="desk"></div>
<div id="dock" class="hit">
  <button id="bGroup">New group</button>
  <button id="bApp">Add app</button>
  <button id="bSite">Add website</button>
</div>
<div id="layer" class="hit"></div>

<script>
const $ = (s) => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
let data = { tiles: [] }, openId = null, ignoring = true;
const cache = {};
const save = () => api.save(data);

// Click-through: the window ignores the mouse except over tiles, buttons and panels.
document.addEventListener('mousemove', (e) => {
  const over = !!e.target.closest('.hit');
  if (over === ignoring) { ignoring = !over; api.ignore(ignoring); }
});

function icon(it, extra) {
  const d = document.createElement('div');
  d.className = 'ico ' + (extra || '');
  d.textContent = (it.name[0] || '?').toUpperCase();
  if (it.type !== 'url') {
    cache[it.value] = cache[it.value] || api.icon(it.value);
    cache[it.value].then((u) => { if (u) { d.textContent = ''; d.style.backgroundImage = `url(${u})`; } });
  }
  return d;
}
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text) n.textContent = text;
  return n;
}
const run = (it) => api.open(it.type, it.value);
const nameOf = (p) => p.split(/[\\/]/).pop().replace(/\.(lnk|exe|url)$/i, '');
const toItem = (p) => ({ id: uid(), name: nameOf(p), type: 'file', value: p });

function renderDesk() {
  const desk = $('#desk');
  desk.replaceChildren();
  for (const t of data.tiles) {
    const tile = el('div', 'tile hit');
    if (t.kind === 'group') {
      const box = el('div', 'box');
      t.items.slice(0, 4).forEach((it) => box.append(icon(it)));
      tile.append(box);
      tile.onclick = () => { openId = t.id; renderPanel(); };
    } else {
      tile.append(icon(t));
      tile.onclick = () => run(t);
    }
    tile.append(el('div', 'label', t.name));
    tile.oncontextmenu = (e) => {
      e.preventDefault();
      ask(`Remove "${t.name}" from the desktop?`, [], () => {
        data.tiles = data.tiles.filter((x) => x.id !== t.id); save(); renderDesk();
      }, 'Remove');
    };
    desk.append(tile);
  }
}

function renderPanel() {
  const layer = $('#layer');
  const g = data.tiles.find((t) => t.id === openId);
  if (!g) { layer.classList.remove('on'); return renderDesk(); }
  layer.classList.add('on');
  layer.replaceChildren();
  layer.onclick = (e) => { if (e.target === layer) closePanel(); };
  const sheet = el('div', 'sheet');
  const head = el('div', 'head');
  const name = el('input'); name.value = g.name; name.setAttribute('aria-label', 'Group name');
  name.onchange = () => { g.name = name.value.trim() || g.name; save(); renderDesk(); };
  const add = el('button', '', 'Add app'); add.onclick = async () => {
    (await api.pick()).forEach((p) => g.items.push(toItem(p))); save(); renderPanel();
  };
  const site = el('button', '', 'Add website'); site.onclick = () => askSite((it) => { g.items.push(it); save(); renderPanel(); });
  const del = el('button', 'danger', 'Delete group'); del.onclick = () => ask(`Delete group "${g.name}"?`, [], () => {
    data.tiles = data.tiles.filter((x) => x.id !== g.id); save(); closePanel();
  }, 'Delete');
  const close = el('button', '', 'Close'); close.onclick = closePanel;
  head.append(name, add, site, del, close);
  const grid = el('div', 'grid');
  g.items.forEach((it) => {
    const w = el('div', 'item');
    const x = el('button', 'x', 'x'); x.title = 'Remove from group';
    x.onclick = (e) => { e.stopPropagation(); g.items = g.items.filter((i) => i.id !== it.id); save(); renderPanel(); };
    const ic = icon(it); ic.onclick = () => run(it);
    w.append(ic, el('div', 'label', it.name), x);
    grid.append(w);
  });
  sheet.append(head, grid, el('p', 'hint', g.items.length ? 'Drop files or folders here to add them.' : 'This group is empty. Drop files or folders here, or use Add app.'));
  sheet.ondragover = (e) => { e.preventDefault(); sheet.classList.add('drop'); };
  sheet.ondragleave = () => sheet.classList.remove('drop');
  sheet.ondrop = (e) => {
    e.preventDefault();
    [...e.dataTransfer.files].forEach((f) => { const p = api.pathOf(f); if (p) g.items.push(toItem(p)); });
    save(); renderPanel();
  };
  layer.append(sheet);
  renderDesk();
}
function closePanel() { openId = null; $('#layer').classList.remove('on'); $('#layer').replaceChildren(); renderDesk(); }

// Small modal form used for names, websites and confirmations.
function ask(title, fields, done, okText) {
  const layer = $('#layer');
  const prev = openId;
  layer.classList.add('on'); layer.replaceChildren();
  const sheet = el('div', 'sheet'); sheet.style.width = '360px';
  const form = el('form', 'ask'); form.append(el('h3', '', title));
  const inputs = fields.map((f) => { const i = el('input'); i.placeholder = f; i.setAttribute('aria-label', f); form.append(i); return i; });
  const row = el('div', 'row');
  const cancel = el('button', '', 'Cancel'); cancel.type = 'button';
  const ok = el('button', '', okText || 'Save');
  row.append(cancel, ok); form.append(row); sheet.append(form); layer.append(sheet);
  const back = () => { openId = prev; prev ? renderPanel() : (layer.classList.remove('on'), layer.replaceChildren()); };
  cancel.onclick = back;
  form.onsubmit = (e) => { e.preventDefault(); const v = inputs.map((i) => i.value.trim()); if (fields.length && !v[0]) return; done(v); back(); };
  inputs[0] ? inputs[0].focus() : ok.focus();
}
function askSite(cb) {
  ask('Add website', ['Name', 'Address, for example https://github.com'], ([n, u]) => {
    if (!u) return;
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    cb({ id: uid(), name: n || new URL(u).hostname, type: 'url', value: u });
  });
}

$('#bGroup').onclick = () => ask('New group', ['Group name'], ([n]) => {
  data.tiles.push({ id: uid(), kind: 'group', name: n, items: [] }); save(); renderDesk();
});
$('#bApp').onclick = async () => {
  (await api.pick()).forEach((p) => data.tiles.push({ kind: 'app', ...toItem(p) })); save(); renderDesk();
};
$('#bSite').onclick = () => askSite((it) => { data.tiles.push({ kind: 'app', ...it }); save(); renderDesk(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#layer').classList.contains('on')) closePanel(); });

api.load().then((d) => { data = d; renderDesk(); });
</script>
</body>
</html>
